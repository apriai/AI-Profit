# Instalador de PRUEBA de 0.10.32. Solo esta rama.
# No crea etiqueta, no publica release y no corre en main.
# Este archivo no debe fusionarse: se quita de la rama en cuanto el artefacto queda listo.
name: Instalador de prueba

on:
  push:
    branches:
      - cursor/apertura-vivo-8bec

permissions:
  contents: read

jobs:
  instalador-prueba:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: NSIS 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $nsis = "C:\Program Files (x86)\NSIS"
          $ok = $false
          foreach ($i in 1..2) {
            choco install nsis --version=3.11.0 -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath "$nsis\makensis.exe")) { $ok = $true; break }
            Write-Output "Intento $i de Chocolatey fallo. Se reintenta."
            Start-Sleep -Seconds 10
          }
          if (-not $ok) {
            Write-Output "Chocolatey no respondio. Se baja el zip de NSIS 3.11."
            $dest = "C:\nsis-311"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $zip = "$env:RUNNER_TEMP\nsis-3.11.zip"
            Invoke-WebRequest -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip" -OutFile $zip -UseBasicParsing
            $hash = (Get-FileHash -Algorithm SHA1 -Path $zip).Hash
            if ($hash -ne "EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D") { throw "El zip de NSIS no coincide ($hash)" }
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            $exe = Get-ChildItem -Path $dest -Recurse -Filter makensis.exe | Select-Object -First 1
            if (-not $exe) { throw "El zip de NSIS no trae makensis.exe" }
            $nsis = $exe.DirectoryName
            $ok = $true
          }
          if (-not $ok) { throw "No se pudo instalar NSIS 3.11" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Comprobar imagenes del instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gfx = "instalador\gfx"
          foreach ($nombre in @("1-escenario.jpg","2-multitud-islas.jpg","3-granja-cerca.jpg","4-isla-granja.jpg","p1-bienvenida.bmp","p2-carpeta.bmp","p3-progreso.bmp","p4-listo.bmp","btn-instalar.bmp","btn-abrir.bmp")) {
            if (-not (Test-Path -LiteralPath (Join-Path $gfx $nombre))) { throw "Falta $gfx\$nombre" }
          }

      - name: Construir Profito-Setup.exe
        shell: pwsh
        run: .\instalador\construir.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Profito-Setup-0.10.32-prueba
          path: dist/Profito-Setup.exe
          if-no-files-found: error
