name: Instalador Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: NSIS 3.11
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path -LiteralPath "$nsis\makensis.exe")) { throw "No esta makensis" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Comprobar imagenes del instalador
        shell: pwsh
        run: |
          $gfx = "instalador\gfx"
          foreach ($nombre in @("1-escenario.jpg","2-multitud-islas.jpg","3-granja-cerca.jpg","4-isla-granja.jpg","p1-bienvenida.bmp","p2-carpeta.bmp","p3-progreso.bmp","p4-listo.bmp","btn-instalar.bmp","btn-abrir.bmp")) {
            if (-not (Test-Path -LiteralPath (Join-Path $gfx $nombre))) { throw "Falta $gfx\$nombre" }
          }

      - name: Construir Profito-Setup.exe
        shell: pwsh
        run: .\instalador\construir.ps1

      - name: Publicar en la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "AI Profit $tag" --notes "Instalador de Windows: Profito-Setup.exe"
          }
          gh release upload $tag "dist\Profito-Setup.exe" --clobber
