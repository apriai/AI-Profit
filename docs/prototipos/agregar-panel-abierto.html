#tlLuces{display:inline-flex;gap:7px;align-items:center;font-size:12px}#tlLuces .tlEstT{font-weight:600;margin-right:2px}#tlLuces span{position:relative;display:inline-flex;padding:6px;margin:-3px;cursor:help;border-radius:50%;pointer-events:auto}#tlLuces span i{pointer-events:auto;cursor:help}#tlLuces span[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(20,12,40,.95);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:99999;pointer-events:none}#tlLuces span:hover{background:rgba(255,255,255,.12)}#tlLuces i{margin-right:0!important}

/* Mascota del precio actual + Logs colapsable */
#prLive .rng .tlMas{position:absolute;top:-10px;width:30px;height:30px;margin-left:-15px;z-index:3;display:block;transition:left .55s cubic-bezier(.3,.7,.3,1)}

#prLive .rng .tlMas .bz{transform-origin:50% 92%;animation:tlBreath 3s ease-in-out infinite;animation-delay:var(--bd,0s)}
#prLive .rng .tlMas .s1{stop-color:hsl(var(--mh,68) 96% 70%)}#prLive .rng .tlMas .s2{stop-color:hsl(var(--mh,68) 88% 52%)}#prLive .rng .tlMas .s3{stop-color:hsl(var(--mh,68) 85% 38%)}
#prLive .rng .tlMas .ey{transform:translate(var(--lx,0px),0);transition:transform .3s ease}
#prLive .rng .tlMas .e{fill:#1b1a20;transform-box:fill-box;transform-origin:center;transform:scale(calc(1 + .5*var(--wo,0)),calc(1 + .22*var(--wo,0)))}

#prLive .rng .tlMas.wr .br,#prLive .rng .tlMas.wr .dpw{display:inline}
#prLive .rng .tlMas.wr .sv{animation:tlShiv var(--sh,.5s) linear infinite;animation-delay:var(--bd,0s)}

@keyframes tlBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.955)}}

@keyframes tlDrip{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{opacity:.9}100%{transform:translateY(5px);opacity:0}}

html,body{margin:0;min-height:100%;background:#12081e;color:#ececf3;font:13px/1.45 Inter,system-ui,-apple-system,sans-serif}
body{background:

  radial-gradient(ellipse at 90% 110%,#2a1048 0%,#12081e 58%);

#prLive{display:block!important;box-shadow:0 22px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04);max-height:calc(100vh - 120px)}

/* Botón y cajón Agregar/Promediar */

<body>
  <div class="chrome">
    <div class="who">
      <h1>Profito <em>· prototipo</em></h1>
      <p>Panel de trade abierto · Agregar/Promediar · no envía órdenes</p>
    </div>
    <div class="tools">
      <button type="button" data-sym="MNQ" class="on">MNQ</button>
      <button type="button" data-sym="NQ">NQ</button>
      <button type="button" data-plan="25K" class="on">25K</button>
      <button type="button" data-plan="50K">50K</button>
      <button type="button" id="resetBtn">Reiniciar trade</button>
    </div>
  </div>

  <div id="prLive">
    <div id="liveHead"></div>
    <div id="liveViz"></div>
    <button type="button" class="act addBtn" id="addToggle" aria-expanded="false">Agregar/Promediar</button>
    <div class="addWrap" id="addWrap">
      <div class="addInner">

<script>
// Cálculo puro del prototipo Agregar / promediar. Lo usa el HTML (copiado) y este test.
const TICK = 0.25;

const SPEC = {
  MNQ: { pt: 2, tickUsd: 0.5, comm: 1 },
  NQ:  { pt: 20, tickUsd: 5, comm: 3.5 },
};

const LIMITS = {
  '25K': { MNQ: 20, NQ: 2, ddl: 600, dd: 1000, tp: 1600 },
  '50K': { MNQ: 40, NQ: 4, ddl: 1200, dd: 2000, tp: 3200 },
};

const ceilTick = (x) => Math.ceil(x / TICK - 1e-9) * TICK;
const floorTick = (x) => Math.floor(x / TICK + 1e-9) * TICK;
const roundTick = (x) => Math.round(x / TICK) * TICK;
const money = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
const onTick = (x) => Number.isFinite(x) && Math.abs(x / TICK - Math.round(x / TICK)) < 1e-8;

function avgPrice(q1, p1, q2, p2) {
  const qty = q1 + q2;
  const exact = (q1 * p1 + q2 * p2) / qty;
  return { exact, tick: roundTick(exact), qty };
}

/** PnL neto si se sale a exitPx (incluye comisión ida y vuelta de toda la posición). */
function exitPnl({ long, qty, avg, exitPx, pt, comm }) {
  const dir = long ? 1 : -1;
  return qty * dir * (exitPx - avg) * pt - comm;
}

/**
 * SL en el lado de riesgo (pérdida), redondeado al tick en dirección segura:
 * más cerca del promedio / del precio, de modo que el riesgo real ≤ objetivo.
 * Long: SL = ceilTick(avg - dist). Short: SL = floorTick(avg + dist).
 */
function slForRisk({ long, avg, dist }) {
  return long ? ceilTick(avg - dist) : floorTick(avg + dist);
}

/**
 * SL que protege una ganancia neta (colchón ya movido), redondeado para que
 * lo protegido real sea ≥ al objetivo. Long sube el SL; short lo baja.
 */
function slForLock({ long, avg, dist }) {
  return long ? ceilTick(avg + dist) : floorTick(avg - dist);
}

/**
 * TP redondeado para que el neto real sea ≥ al objetivo.
 * Long: ceilTick(avg + dist). Short: floorTick(avg - dist).
 */
function tpForTarget({ long, avg, dist }) {
  return long ? ceilTick(avg + dist) : floorTick(avg - dist);
}

function compute(i) {
  const errors = [];
  const warnings = [];
  const symbol = i.symbol === 'NQ' ? 'NQ' : 'MNQ';
  const plan = i.plan === '50K' ? '50K' : '25K';
  const inst = SPEC[symbol];
  const lim = LIMITS[plan];
  const pt = inst.pt;
  const commUnit = Number(i.comm);
  const long = i.side !== 'short';
  const q1 = Number(i.qty);
  const p1 = Number(i.avg);
  const sl0 = Number(i.sl);
  const tp0 = Number(i.tp);
  const q2 = Number(i.addQty);
  const p2 = Number(i.addPrice);
  const live = Number(i.live != null ? i.live : i.addPrice);
  const ddlLeft = Number(i.ddlLeft);
  const ddLeft = Number(i.ddLeft);

  const numOk = [q1, p1, sl0, tp0, q2, p2, live, commUnit, ddlLeft, ddLeft].every(Number.isFinite);
  if (!numOk) {
    return { ok: false, errors: ['Faltan datos numéricos o hay un valor inválido.'], warnings };
  }
  if (!Number.isInteger(q1) || q1 < 1 || !Number.isInteger(q2) || q2 < 1) {
    errors.push('Las cantidades tienen que ser enteros de al menos 1 contrato.');
  }
  if (p1 <= 0 || p2 <= 0 || live <= 0 || sl0 <= 0 || tp0 <= 0) {
    errors.push('Los precios tienen que ser mayores que cero.');
  }
  if (commUnit < 0) errors.push('La comisión no puede ser negativa.');
  for (const [label, px] of [['entrada actual', p1], ['SL actual', sl0], ['TP actual', tp0], ['precio de agrega', p2], ['precio actual', live]]) {
    if (Number.isFinite(px) && px > 0 && !onTick(px)) {
      warnings.push(`El ${label} (${px}) no cae en un tick de 0.25. Revisa ese precio.`);
    }
  }

  const Q = q1 + q2;
  const comm1 = q1 * commUnit;
  const commQ = Q * commUnit;
  const avgExact = (q1 * p1 + q2 * p2) / Q;
  const avgTick = roundTick(avgExact);

  const slRiskSide = long ? sl0 < p1 - 1e-12 : sl0 > p1 + 1e-12;
  const slLockSide = long ? sl0 > p1 + 1e-12 : sl0 < p1 - 1e-12;
  const currentGrossSl = q1 * Math.abs(p1 - sl0) * pt;
  const currentRisk = slRiskSide ? money(currentGrossSl + comm1) : 0;
  const currentLock = slLockSide ? money(currentGrossSl - comm1) : 0;
  const currentTarget = money(q1 * Math.abs(tp0 - p1) * pt - comm1);

  const against = long ? p2 < p1 - 1e-12 : p2 > p1 + 1e-12;
  const favor = long ? p2 > p1 + 1e-12 : p2 < p1 - 1e-12;
  if (against) {
    warnings.push('Promedias en contra: el precio de agrega está peor que tu entrada. El riesgo sube fácil y el stop nuevo puede quedar ya tocado.');
  } else if (favor) {
    warnings.push('Piramidas a favor: el precio de agrega está mejor que tu entrada. Si dejas el SL donde está, el riesgo en dólares crece mucho.');
  }

  const maxQty = lim[symbol];
  if (Q > maxQty) {
    errors.push(`El total sería ${Q} ${symbol}, por encima del tope Lucid de ${maxQty} en una cuenta ${plan}.`);
  }

  const leaveSlPnl = exitPnl({ long, qty: Q, avg: avgExact, exitPx: sl0, pt, comm: commQ });
  const leaveTpPnl = exitPnl({ long, qty: Q, avg: avgExact, exitPx: tp0, pt, comm: commQ });
  const leave = {
    sl: sl0,
    tp: tp0,
    risk: leaveSlPnl < 0 ? money(-leaveSlPnl) : 0,
    lock: leaveSlPnl >= 0 ? money(leaveSlPnl) : 0,
    target: money(leaveTpPnl),
    slAlreadyHit: long ? sl0 >= live - 1e-12 : sl0 <= live + 1e-12,
    tpAlreadyHit: long ? tp0 <= live + 1e-12 : tp0 >= live - 1e-12,
  };

  const riskMode = i.riskMode === 'custom' ? 'custom' : 'keep';
  const tpMode = i.tpMode === 'custom' ? 'custom' : 'keep';

  let sl = null;
  let slKind = 'risk';
  let targetRisk = null;
  let targetLock = null;

  if (riskMode === 'keep' && slLockSide) {
    slKind = 'lock';
    targetLock = currentLock;
    const dist = (targetLock + commQ) / (Q * pt);
    if (!Number.isFinite(dist) || dist <= 0) {
      errors.push('No se puede mantener lo protegido: el colchón neto actual no alcanza para cubrir la comisión de la posición nueva.');
    } else {
      sl = slForLock({ long, avg: avgExact, dist });
    }
  } else {
    slKind = 'risk';
    targetRisk = riskMode === 'keep' ? currentRisk : Number(i.customRisk);
    if (!Number.isFinite(targetRisk) || targetRisk <= 0) {
      errors.push('Indica un riesgo objetivo en dólares mayor que cero.');
    } else if (targetRisk <= commQ + 1e-9) {
      errors.push(`El riesgo objetivo ($${money(targetRisk)}) no alcanza ni para la comisión total ($${money(commQ)}).`);
    } else {
      const dist = (targetRisk - commQ) / (Q * pt);
      sl = slForRisk({ long, avg: avgExact, dist });
    }
  }

  let slPnl = null;
  let realRisk = null;
  let realLock = null;
  let slDistPts = null;
  if (sl != null) {
    slPnl = exitPnl({ long, qty: Q, avg: avgExact, exitPx: sl, pt, comm: commQ });
    realRisk = slPnl < 0 ? money(-slPnl) : 0;
    realLock = slPnl >= 0 ? money(slPnl) : 0;
    slDistPts = money(Math.abs(avgExact - sl));
    if (slDistPts + 1e-9 < TICK) {
      errors.push('El SL nuevo quedaría a menos de 1 tick del promedio. No hay distancia válida.');
    }
    if (long && sl >= live - 1e-12) {
      errors.push(`El SL nuevo (${fmtPx(sl)}) quedaría en o por encima del precio actual (${fmtPx(live)}). El stop ya estaría tocado. Prueba un riesgo mayor, menos contratos o no agregar aquí.`);
    }
    if (!long && sl <= live + 1e-12) {
      errors.push(`El SL nuevo (${fmtPx(sl)}) quedaría en o por debajo del precio actual (${fmtPx(live)}). El stop ya estaría tocado. Prueba un riesgo mayor, menos contratos o no agregar aquí.`);
    }
    if (slKind === 'risk' && targetRisk != null && realRisk > targetRisk + 0.009) {
      errors.push('El redondeo no pudo dejar el riesgo por debajo del objetivo. Revisa los precios.');
    }
  }

  const targetUsd = tpMode === 'keep' ? currentTarget : Number(i.customTp);
  let tp = null;
  let realTarget = null;
  let tpDistPts = null;
  if (!Number.isFinite(targetUsd)) {
    errors.push('Indica un objetivo en dólares.');
  } else {
    const distTp = (targetUsd + commQ) / (Q * pt);
    if (distTp <= 0) {
      errors.push('El objetivo en dólares es demasiado bajo (ni cubre la comisión).');
    } else {
      tp = tpForTarget({ long, avg: avgExact, dist: distTp });
      realTarget = money(exitPnl({ long, qty: Q, avg: avgExact, exitPx: tp, pt, comm: commQ }));
      tpDistPts = money(Math.abs(tp - avgExact));
      if (long && tp <= live + 1e-12) {
        warnings.push(`El TP nuevo (${fmtPx(tp)}) ya está en o por debajo del precio actual. El objetivo ya se habría alcanzado.`);
      }
      if (!long && tp >= live - 1e-12) {
        warnings.push(`El TP nuevo (${fmtPx(tp)}) ya está en o por encima del precio actual. El objetivo ya se habría alcanzado.`);
      }
      if (realTarget + 0.009 < targetUsd) {
        errors.push('El redondeo no pudo dejar el objetivo neto en o por encima de la meta.');
      }
    }
  }

  if (realRisk != null && realRisk > ddlLeft + 1e-9) {
    errors.push(`El riesgo real ($${money(realRisk)}) supera el daily loss que te queda ($${money(ddlLeft)}).`);
  }
  if (realRisk != null && realRisk > ddLeft + 1e-9) {
    errors.push(`El riesgo real ($${money(realRisk)}) supera el drawdown de cierre que te queda ($${money(ddLeft)}).`);
  }
  if (leave.risk > ddlLeft + 1e-9) {
    warnings.push(`Si dejas el SL donde está, el riesgo sería $${money(leave.risk)} y se pasa del daily loss que te queda ($${money(ddlLeft)}).`);
  }
  if (leave.risk > ddLeft + 1e-9) {
    warnings.push(`Si dejas el SL donde está, el riesgo sería $${money(leave.risk)} y se pasa del drawdown de cierre que te queda ($${money(ddLeft)}).`);
  }
  if (leave.slAlreadyHit) {
    warnings.push('El SL actual ya está en o más allá del precio de ahora. Si lo dejas ahí, el stop ya estaría tocado.');
  }

  const ok = errors.length === 0 && sl != null && tp != null;
  return {
    ok,
    errors,
    warnings,
    symbol,
    plan,
    long,
    pt,
    q1,
    p1,
    q2,
    p2,
    live,
    Q,
    comm1: money(comm1),
    commQ: money(commQ),
    commUnit: money(commUnit),
    avgExact,
    avgTick,
    slIsRisk: slRiskSide,
    slIsLock: slLockSide,
    currentRisk,
    currentLock,
    currentTarget,
    against,
    favor,
    maxQty,
    leave,
    riskMode,
    tpMode,
    slKind,
    targetRisk: targetRisk != null ? money(targetRisk) : null,
    targetLock: targetLock != null ? money(targetLock) : null,
    targetUsd: Number.isFinite(targetUsd) ? money(targetUsd) : null,
    sl,
    tp,
    slDistPts,
    tpDistPts,
    realRisk,
    realLock,
    realTarget,
    sl0,
    tp0,
  };
}

function fmtPx(x) {
  if (!Number.isFinite(x)) return '—';
  return x.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtUsd(x) {
  if (!Number.isFinite(x)) return '—';
  const n = money(x);
  const sign = n < 0 ? '−' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

 const wr=f>.02,hue=(68-68*f).toFixed(1),sh=(.55-.43*f).toFixed(2),wo=Math.min(1,f*2).toFixed(2),bo=Math.min(1,f*3).toFixed(2),so=Math.min(1,f*2.5).toFixed(2),lx=((S.dir||(wr?-1:0))*2.4).toFixed(1),ph=((performance.now()/1000)%3).toFixed(2),start=mv&&prev!=null?prev:x;

window.__tlViz=function(s){if(!s)return"";const nf=(v,sg)=>(sg?(v<0?"−":"+"):"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}),p=s.pnl!=null?Number(s.pnl):(s.brokerPl!=null?Number(s.brokerPl):NaN),okp=isFinite(p);

 const en=+s.entry,lg=s.side==="long",sp=+s.slPts,tpPr=+s.tpPrice,tpP=isFinite(+s.tpPts)&&+s.tpPts>0?+s.tpPts:(isFinite(tpPr)&&isFinite(en)?Math.abs(tpPr-en):NaN),px=+s.price,st=s.steps||[],k=s.step||0,fv=v=>lg?v-en:en-v;
 if([en,sp,tpP].every(isFinite)&&sp>0&&tpP>0){const tot=sp+tpP,X=f=>Math.max(0,Math.min(100,(f+sp)/tot*100)),ex=X(0),slI=lg?en-sp:en+sp,tpI=isFinite(tpPr)?tpPr:(lg?en+tpP:en-tpP),fp=isFinite(px)?fv(px):null,lk=(k>0||s.locked)&&isFinite(+s.sl)?fv(+s.sl):null,eL=Math.max(17,Math.min(83,ex));

 const cur=k>0?st[k-1]:null,nx=st[k];
 if(cur||s.locked){const lp=cur?cur.lockPts:null,lu=cur?cur.lockUsd:null,tk=lp!=null?Math.round(lp/.25):null,be=lp!=null&&lp<=1;
  h+=`<div class=lockb${be?' title="TradingView casi no lo muestra: el stop queda pegado a la entrada, pero la orden ya está movida."':""}>✓ ${lp===0?"Stop en break even":be?"Stop en break even (+"+tk+" ticks)":lu!=null?"Stop protegido +"+nf(lu):"Stop movido"} · SL ${s.sl??"—"}</div>`}
 else if(s.lockPending)h+=`<div class="lockb pend">Moviendo el stop…</div>`;
 if(nx&&okp){const tr=+nx.triggerUsd||0,pc=tr>0?Math.max(0,Math.min(100,p/tr*100)):0;h+=`<div class=prog><div class=bh><span>Hacia el paso ${nx.n}</span><b>${nf(Math.max(p,0))} / ${nf(tr)}</b></div><div class=bt><i style="width:${pc.toFixed(1)}%"></i></div></div>`}

const fm = (v) => "$" + Math.abs(+v).toLocaleString("en-US", { maximumFractionDigits: 2 });
const nfPnl = (v) => (v < 0 ? "−" : "+") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const px = (v) => Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function stepsFor(symbol, qty) {
  const pt = SPEC[symbol].pt, tUsd = pt * TICK * qty, comm = SPEC[symbol].comm;
  const NET = 100, SLIP = 1, EXTRA = 15;
  const lockUsd = Math.round(Math.ceil((NET + comm * qty + SLIP * tUsd) / tUsd - 1e-9) * tUsd * 100) / 100;
  const triggerUsd = Math.round((lockUsd + Math.ceil(EXTRA / tUsd - 1e-9) * tUsd) * 100) / 100;
  const lockPts = Math.round(lockUsd / (pt * qty) / TICK) * TICK;
  return [{ n: 1, triggerUsd, lockUsd, lockPts }];
}

function seedTrade(symbol, plan) {
  const long = true;
  const qty = symbol === "NQ" ? 1 : 5;
  const entry = 21000;
  const slPts = symbol === "NQ" ? 15 : 50;
  const tpPts = symbol === "NQ" ? 80 : 160;
  const sl = entry - slPts;
  const tp = entry + tpPts;
  return {
    symbol, plan, side: "long", long,
    qty, entry, sl, tp, slPts, riskPts: slPts, tpPts,
    price: entry + 8 * TICK,
    strategy: { name: "Rascacielo (Dia Minimo+Colchon)" },
    mode: "real", realLabel: "evaluación",
    step: 0, locked: false, lockPending: false,
    steps: stepsFor(symbol, qty),
    comm: SPEC[symbol].comm,
    ddlLeft: LIMITS[plan].ddl,
    ddLeft: LIMITS[plan].dd,
    log: ["prototipo: trade de ejemplo · " + qty + " " + symbol + " @ " + entry]
  };
}

let T = seedTrade("MNQ", "25K");
let addQty = 2;
let drawerOpen = false;
let ticking = true;

function pnlNow() {
  const dir = T.long ? 1 : -1;
  return money(T.qty * dir * (T.price - T.entry) * SPEC[T.symbol].pt);
}

function status() {
  const p = pnlNow();
  return {
    ...T,
    pnl: p,
    price: money(T.price),
    entry: money(T.entry),
    sl: money(T.sl),
    tpPrice: money(T.tp),
    slPts: T.riskPts,
    tpPts: T.tpPts,
    fuenteLider: "broker-lectura",
    fuenteModo: "prototipo"
  };
}

function renderPreview() {
  const r = preview();
  const riskTxt = r.slKind === "lock" ? ("protege " + fmtUsd(r.realLock)) : fmtUsd(r.realRisk);
  document.getElementById("prev").innerHTML = `
    <div class="row"><span>Agrega</span><b>${r.q2 || addQty} ${T.symbol} @ ${fmtPx(T.price)} · mercado</b></div>
    <div class="row"><span>Promedio nuevo</span><b class="gold">${r.avgExact!=null?(onTick(r.avgExact)?fmtPx(r.avgExact):fmtPx(r.avgExact)+" · tick "+fmtPx(r.avgTick)): "—"}</b></div>
    <div class="row"><span>SL nuevo</span><b class="red">${r.sl!=null?fmtPx(r.sl):"—"}</b></div>
    <div class="row"><span>Riesgo real</span><b>${riskTxt}</b></div>
    <div class="row"><span>TP nuevo</span><b class="lime">${r.tp!=null?fmtPx(r.tp):"—"}</b></div>
    <div class="row"><span>Objetivo neto</span><b class="lime">${fmtUsd(r.realTarget)}</b></div>`;
  const max = r.maxQty || LIMITS[T.plan][T.symbol];
  const Q = (r.Q != null ? r.Q : T.qty + addQty);
  const badges = [];
  if (r.against) badges.push('<i class="warn">En contra</i>');
  else if (r.favor) badges.push('<i class="ok">A favor</i>');
  else badges.push('<i>Mismo precio</i>');
  badges.push(`<i class="${Q>max?"bad":"ok"}">${Q} / ${max} ${T.symbol}</i>`);
  if (r.realRisk != null) {
    badges.push(`<i class="${r.realRisk>T.ddlLeft?"bad":"ok"}">DDL ${fmtUsd(T.ddlLeft)}</i>`);
    badges.push(`<i class="${r.realRisk>T.ddLeft?"bad":"ok"}">DD ${fmtUsd(T.ddLeft)}</i>`);
  }
  document.getElementById("badges").innerHTML = badges.join("");
  const err = document.getElementById("addErr");
  if (r.errors && r.errors.length) {
    err.textContent = r.errors[0];
    err.classList.add("show");
  } else {
    err.classList.remove("show");
    err.textContent = "";
  }
  document.getElementById("addGo").disabled = !r.ok;
  window.__prev = r;
}

function renderQtyBtns() {
  const opts = T.symbol === "NQ" ? (T.plan === "50K" ? [1, 2] : [1]) : [1, 2, 5, 10];
  if (!opts.includes(addQty)) addQty = opts[0];
  document.getElementById("qtyLb").textContent = "Agregar contratos " + T.symbol;
  document.getElementById("qtyBtns").innerHTML = opts.map(n =>
    `<button type="button" data-q="${n}" class="${n===addQty?"on":""}">+${n}</button>`
  ).join("");
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2800);
}

function log(line) {
  T.log.push(line);
  T.log = T.log.slice(-8);
}

function maybeLock() {
  if (T.locked || T.step > 0) return;
  const st = T.steps[0];
  const p = pnlNow();
  if (st && p >= st.triggerUsd) {
    const dir = T.long ? 1 : -1;
    T.sl = roundTick(T.entry + dir * st.lockPts);
    T.locked = true;
    T.step = 1;
    log("colchón: stop a " + fmtPx(T.sl) + " · protege +" + fm(st.lockUsd));
    renderHeadKv();
  }
}

function tick() {
  if (!ticking) return;
  const lo = Math.min(T.sl, T.tp) + TICK;
  const hi = Math.max(T.sl, T.tp) - TICK;
  const mid = T.entry;
  let step = 0;
  const r = Math.random();
  if (r < 0.28) step = 0;
  else if (r < 0.78) step = TICK;
  else if (r < 0.95) step = TICK * 2;
  else step = TICK * 3;
  const sign = (Math.random() < 0.47 + 0.12 * Math.sign(mid - T.price)) ? 1 : -1;
  let nx = roundTick(T.price + sign * step);
  if (nx < lo) nx = lo;
  if (nx > hi) nx = hi;
  T.price = nx;
  maybeLock();
  const p = pnlNow();
  const big = document.querySelector("#prLive .tlBig");
  if (big) {
    big.textContent = nfPnl(p);
    big.className = "tlBig " + (p >= 0 ? "pos" : "neg");
  }
  const kvPx = document.getElementById("kvPx");
  if (kvPx) kvPx.textContent = px(T.price);
  const kvSl = document.getElementById("kvSl");
  if (kvSl) kvSl.textContent = px(T.sl);
  renderViz();
  const prog = document.querySelector("#prLive .prog .bt i");
  const stepN = T.steps[T.step];
  if (prog && stepN) {
    const pc = stepN.triggerUsd > 0 ? Math.max(0, Math.min(100, Math.max(p, 0) / stepN.triggerUsd * 100)) : 0;
    prog.style.width = pc.toFixed(1) + "%";
  }
  if (drawerOpen) renderPreview();
}

function openDrawer(open) {
  drawerOpen = !!open;
  document.getElementById("addWrap").classList.toggle("open", drawerOpen);
  document.getElementById("addToggle").setAttribute("aria-expanded", drawerOpen ? "true" : "false");
  if (drawerOpen) {
    renderQtyBtns();
    renderPreview();
  }
}

function confirmAdd() {
  const r = preview();
  if (!r || !r.ok) return;
  T.qty = r.Q;
  T.entry = r.avgExact;
  T.sl = r.sl;
  T.tp = r.tp;
  T.tpPts = r.tpDistPts;
  T.steps = stepsFor(T.symbol, T.qty);
  if (r.slKind === "lock") {
    T.locked = true;
    T.step = 1;
    T.riskPts = T.riskPts || r.slDistPts;
  } else {
    T.locked = false;
    T.step = 0;
    T.riskPts = r.slDistPts;
  }
  log("simulación: +" + r.q2 + " " + T.symbol + " @ " + fmtPx(r.p2) + " (mercado) · avg " + fmtPx(r.avgExact) + " · SL " + fmtPx(r.sl) + " · TP " + fmtPx(r.tp));
  renderHeadKv();
  renderViz();
  const live = document.getElementById("prLive");
  live.classList.remove("pop");
  void live.offsetWidth;
  live.classList.add("pop");
  openDrawer(false);
  toast("Simulación: se agregaron " + r.q2 + " " + T.symbol + " a " + fmtPx(r.p2) + ". No se envió ninguna orden.");
}

function resetTrade(symbol, plan) {
  T = seedTrade(symbol || T.symbol, plan || T.plan);
  window.__tlMasS = { x: null, dir: 0 };
  addQty = T.symbol === "NQ" ? 1 : 2;
  renderHeadKv();
  renderViz();
  renderQtyBtns();
  if (drawerOpen) renderPreview();
  document.querySelectorAll(".tools [data-sym]").forEach(b => b.classList.toggle("on", b.dataset.sym === T.symbol));
  document.querySelectorAll(".tools [data-plan]").forEach(b => b.classList.toggle("on", b.dataset.plan === T.plan));
}

document.getElementById("addToggle").addEventListener("click", () => openDrawer(!drawerOpen));
document.getElementById("addCancel").addEventListener("click", () => openDrawer(false));
document.getElementById("addGo").addEventListener("click", confirmAdd);
document.getElementById("qtyBtns").addEventListener("click", (e) => {
  const b = e.target.closest("[data-q]");
  if (!b) return;
  addQty = +b.dataset.q;
  renderQtyBtns();
  renderPreview();
});
document.querySelector("[data-stop]").addEventListener("click", () => {
  toast("En este prototipo no se cierra la posición.");
});
document.querySelectorAll(".tools [data-sym]").forEach(b => b.addEventListener("click", () => resetTrade(b.dataset.sym, T.plan)));
document.querySelectorAll(".tools [data-plan]").forEach(b => b.addEventListener("click", () => resetTrade(T.symbol, b.dataset.plan)));
document.getElementById("resetBtn").addEventListener("click", () => { resetTrade(T.symbol, T.plan); toast("Trade de ejemplo reiniciado."); });

resetTrade("MNQ", "25K");
setInterval(tick, 650);
</script>
</body>
</html>
