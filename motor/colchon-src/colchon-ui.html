<script>/* Prueba colchón: el pill del agente abre directamente el panel (estrategia/cuenta/símbolo, BUY/SELL, probabilidad). Sin botón Prueba. */
(function(){const K="tl_prueba";let on=true,phase="off",sym="MNQ",qty=10,accs=null,accId=null,strs=null,stratId="dia-minimo-colchon",chk={paper:false,msg:"Revisando…",account:{}},prevBot=null,pollT=0,lastSum=null;
const st=document.createElement("style");st.textContent=`
#prBtn{position:fixed;right:22px;top:84px;z-index:12;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(12,8,24,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.78);font:600 12px Inter,system-ui;letter-spacing:.3px;cursor:pointer;transition:.25s}
#prBtn:hover{color:#fff;border-color:rgba(255,255,255,.22)}#prBtn .d{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:.25s}#prBtn.on{color:#ffe7a3;border-color:rgba(255,216,107,.45);box-shadow:0 0 18px rgba(255,190,40,.2)}#prBtn.on .d{background:#ffb300;box-shadow:0 0 8px #ffb300}
#prBub{position:fixed;z-index:13;transform:translate(-50%,-100%);pointer-events:none;display:none;font:600 11px Inter,system-ui;color:#fff;white-space:nowrap;padding:5px 11px;border-radius:999px;background:rgba(12,8,24,.82);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 18px rgba(0,0,0,.35)}
#prBub.zz{color:#cfd8ff}#prBub.zz:after{content:" z z";opacity:.6;animation:prz 1.6s infinite}@keyframes prz{50%{opacity:.15}}#prBub.warn{color:#ffb3c0;border-color:rgba(255,120,140,.35)}
#prCard{position:fixed;z-index:14;transform:translate(-50%,0);display:none;width:240px;padding:14px;border-radius:16px;background:rgba(12,8,24,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 40px rgba(0,0,0,.45);font:12px Inter,system-ui;color:#ececf3}
#prCard .h{font-weight:600;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}#prCard .h small{font-weight:500;font-size:10px;color:rgba(255,255,255,.45)}
#prCard .bs{display:grid;grid-template-columns:1fr 1fr;gap:8px}#prCard .bs button{border:none;border-radius:11px;padding:12px 0;font:800 14px Inter,system-ui;letter-spacing:.8px;cursor:pointer;transition:transform .15s,filter .15s}#prCard .bs button:hover{transform:translateY(-1px);filter:brightness(1.1)}
#prCard .buy{background:linear-gradient(135deg,#7dff8a,#3ccf5a);color:#062a0e}#prCard .sell{background:linear-gradient(135deg,#ff8fa3,#ff4d6d);color:#2a0610}
#prCard .sz{margin-top:9px;text-align:center;font-size:11px;color:rgba(255,255,255,.5)}#prCard .sz a{color:#ffe7a3;cursor:pointer;text-decoration:none;border-bottom:1px dashed rgba(255,231,163,.5)}
#prCard .sz select,#prCard .sz input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:4px 6px;font:600 12px Inter,system-ui}#prCard .sz input{width:52px;text-align:center}#prCard .sz option{color:#000}#prCard button:disabled{opacity:.4;cursor:not-allowed}
#prCard .msg{margin-top:9px;font-size:11px;line-height:1.45;color:rgba(255,255,255,.6)}#prCard .msg.no{color:#ffb3c0}
#prLive{position:fixed;right:22px;top:128px;z-index:12;width:280px;padding:14px;border-radius:16px;background:rgba(12,8,24,.86);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);font:12px Inter,system-ui;color:#ececf3;display:none;font-variant-numeric:tabular-nums}
#prLive .h{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}#prLive .h span:last-child{font-weight:500;font-size:11px;color:rgba(255,255,255,.5)}
#prLive .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}#prLive .kv div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:6px 9px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.42)}#prLive .kv b{display:block;margin-top:2px;font-size:13px;letter-spacing:0;text-transform:none;color:#fff}
#prLive .lat{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,216,107,.06);border:1px solid rgba(255,216,107,.15);font-size:11px;line-height:1.55;color:rgba(255,255,255,.75)}#prLive .lat b{color:#ffe7a3}
#prLive .lg{margin-top:8px;max-height:72px;overflow:auto;font:10px/1.45 ui-monospace,Consolas,monospace;color:rgba(255,255,255,.45);white-space:pre-wrap}
#prLive .act{margin-top:10px;width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:8px;font:600 12px Inter,system-ui;cursor:pointer}#prLive .act.gold{background:linear-gradient(135deg,#ffd86b,#ffb300);color:#1a0f00;border:none}
#prLive .big{font-size:30px;font-weight:650;letter-spacing:-.8px;margin:2px 0 10px}`;document.head.appendChild(st);
const el=(id,tag="div")=>{const e=document.createElement(tag);e.id=id;document.body.appendChild(e);return e};
const bub=el("prBub"),card=el("prCard"),live=el("prLive");
const J=(u,b)=>fetch(u,b?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}:{cache:"no-store"}).then(r=>r.json()).catch(e=>({ok:false,err:String(e)}));
const MAX={MNQ:20,NQ:2},PV={MNQ:2,NQ:20},CR={MNQ:1,NQ:3.5};const beU=(y,q,P=SPf())=>{const st=P.STEPS?stepsU(y,q,P):[1];const rw=P.STEPS&&!P.STEPS.length?P.TP_USD:(P.NET_USD!=null?P.NET_USD:st[0].lockUsd);return Math.round(P.SL_USD/(P.SL_USD+rw)*1000)/10},beHTML=v=>v==null?"":`<div style="margin-top:8px;text-align:center"><div style="font-size:11px;opacity:.7">Probabilidad necesaria</div><div style="font-size:26px;font-weight:800;color:#3ddc84;line-height:1.1">${(+v).toFixed(1)}%</div><div style="font-size:10px;opacity:.55">para quedar en equilibrio</div></div>`,defQ=y=>((SPf().DEFAULT_QTY||{})[y])||(y==="MNQ"?20:2);const stepsU=(y,q,P=SPf())=>{const t=PV[y]*.25*q,pp=PV[y]*q;return P.STEPS?P.STEPS.map((x,i)=>{const l=Math.round(Math.ceil(x.lock/t-1e-9)*t*100)/100;return {n:i+1,triggerUsd:x.trigger,lockUsd:l,lockPts:Math.round(l/pp/.25)*.25}}):[{n:1,triggerUsd:trigU(y,q,P),lockUsd:lockU(y,q,P),lockPts:Math.round(lockU(y,q,P)/pp/.25)*.25}]};
const SPf=()=>((strs&&strs.find(x=>x.id===stratId))||{params:{SL_USD:600,TP_USD:1600,NET_USD:100,COMM_RT:CR,SLIP_TICKS:1,TRIGGER_EXTRA_USD:15,DEFAULT_QTY:{MNQ:10,NQ:2}}}).params;const lockU=(y,q,P=SPf())=>{const t=PV[y]*.25*q;return Math.round(Math.ceil(((P.NET_USD||0)+((P.COMM_RT||CR)[y]||0)*q+(P.SLIP_TICKS||0)*t)/t-1e-9)*t*100)/100},trigU=(y,q,P=SPf())=>{const t=PV[y]*.25*q;return Math.round((lockU(y,q,P)+Math.ceil((P.TRIGGER_EXTRA_USD||0)/t-1e-9)*t)*100)/100},fm=v=>"$"+(+v).toLocaleString("en-US",{maximumFractionDigits:2});const dur=v=>v==null?"—":v<1?v.toFixed(2)+" s":v<60?v.toFixed(1)+" s":Math.floor(v/60)+":"+String(Math.round(v%60)).padStart(2,"0");const strOpts=()=>!strs?'<option value="dia-minimo-colchon">Día mínimo + colchón</option>':strs.map(x=>`<option value="${x.id}"${x.id===stratId?" selected":""}>${x.name}</option>`).join(""),strDesc=()=>((strs||[]).find(x=>x.id===stratId)||{short:""}).short;
const accOpts=()=>!accs?'<option value="">Cargando cuentas…</option>':!accs.ok?'<option value="">Sin cuentas ('+(accs.err||"?")+')</option>':accs.accounts.map(a=>`<option value="${a.id}"${a.allowed?"":" disabled"}${a.id===accId?" selected":""}>${a.name}${a.real?" · REAL "+(a.realLabel||""):""}${a.current?" · activa":""}${a.allowed?"":" · bloqueada"}</option>`).join("");
setInterval(()=>{if(phase==="choose")loadAccs()},30000);
async function loadAccs(){J("/api/colchon/strategies").then(r=>{if(r&&r.ok){strs=r.strategies;if(!strs.some(x=>x.id===stratId))stratId=r.default;if(phase==="choose")setPhase("choose")}});accs=await J("/api/colchon/accounts");if(accs.ok){const cur=accs.accounts.find(a=>a.current);if(!accId||!accs.accounts.some(a=>a.id===accId&&a.allowed))accId=cur&&cur.allowed?cur.id:((accs.accounts.find(a=>a.allowed)||{}).id||null)}if(phase==="choose"){const e=card.querySelector("[data-acc]");if(e)e.innerHTML=accOpts()}}
const usd=v=>v==null?"—":(v<0?"−":"+")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const ms=v=>v==null?"—":(v<1000?(v/1000).toFixed(2):(v/1000).toFixed(1))+" s";
const S=()=>window.granjaStore;function setAwake(v){const s=S();if(!s||!s.setBot)return;if(prevBot===null)prevBot=s.botEnabled();s.setBot(!!v)}
function restoreBot(){const s=S();if(s&&prevBot!==null)s.setBot(prevBot);prevBot=null}
// posición en pantalla del agente (usa window.__gx.{ci,Lt,P}); si no existe, centro de la pantalla
function agentXY(){const g=window.__gx;if(g&&g.ci&&g.Lt&&g.P){const v=g.ci.getWorldPosition(new g.P);v.y+=.95;v.project(g.Lt);if(v.z<1)return{x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight,ok:1}}return{x:innerWidth/2,y:innerHeight/2-40,ok:0}}
(function follow(){if(on){const p=agentXY();bub.style.left=p.x+"px";bub.style.top=p.y+"px"}requestAnimationFrame(follow)})();
function pin(){const pl=pill(),r=pl?pl.getBoundingClientRect():{left:innerWidth/2,width:0,bottom:70};card.style.left=Math.min(innerWidth-130,Math.max(130,r.left+r.width/2))+"px";card.style.top=(r.bottom+10)+"px"}
function setPhase(p,extra){phase=p;setTimeout(pillLabel,0);if(p==="choose"||p==="blocked")pin();bub.style.display="none";card.style.display="none";bub.className="";
if(p==="sleep"){setAwake(false);bub.textContent="Activado · durmiendo — toca «Agente» arriba";bub.className="zz";bub.style.display="block"}
else if(p==="choose"){setAwake(true);card.innerHTML=`<div class=h>¿Qué hago? <small>${chk.real?`<span style="background:#d32f2f;color:#fff;padding:1px 6px;border-radius:4px;font-weight:800">CUENTA REAL · ${chk.realLabel||""}</span>`:chk.paper?"Paper OK":"Revisando…"}</small></div><div class=bs><button class=buy data-s=long>BUY</button><button class=sell data-s=short>SELL</button></div>
<div class=sz style="margin:0 0 6px">Estrategia <select data-str style="max-width:170px">${strOpts()}</select></div><div class=msg data-sd style="margin:0 0 8px">${strDesc()}</div><div class=sz style="margin:0 0 8px">Cuenta <select data-acc style="max-width:170px">${accOpts()}</select></div><div class=sz><select data-sym><option${sym==="MNQ"?" selected":""}>MNQ</option><option${sym==="NQ"?" selected":""}>NQ</option></select> × <input data-q type=number min=1 max=${MAX[sym]} step=1 value=${qty}> <span>(1–${MAX[sym]})</span></div><div class=msg data-m></div><div data-be></div>`;card.style.display="block";
 const sx=card.querySelector("[data-str]");sx.onclick=e=>e.stopPropagation();sx.onchange=e=>{stratId=e.target.value;qty=defQ(sym);setPhase("choose")};const ac=card.querySelector("[data-acc]");ac.onclick=e=>e.stopPropagation();ac.onchange=e=>{accId=e.target.value};const qi=card.querySelector("[data-q]"),m=card.querySelector("[data-m]"),bb=card.querySelectorAll("[data-s]");
 const upd=()=>{const q=+qi.value,okq=Number.isInteger(q)&&q>=1&&q<=MAX[sym];bb.forEach(b=>b.disabled=!okq);if(okq)qty=q;const pv=PV[sym]*(okq?q:1),r=u=>Math.round(u/pv/.25)*.25,qq=okq?q:1,lu=lockU(sym,qq),tu=trigU(sym,qq),tr=r(tu),lk=r(lu);
  card.querySelector("[data-be]").innerHTML=okq?beHTML(beU(sym,qq)):"";m.className=okq?"msg":"msg no";m.textContent=okq?`Abre a mercado ya · SL −${fm(SPf().SL_USD)} (${r(SPf().SL_USD)} pts) / TP +${fm(SPf().TP_USD)} (${r(SPf().TP_USD)} pts) · ${SPf().STEPS?(!SPf().STEPS.length?"Stop fijo: sin movimientos de SL":"Escalones: "+stepsU(sym,qq).map(x=>`+${fm(x.triggerUsd)} → protege +${fm(x.lockUsd)} (${x.lockPts} pts)`).join(" · ")):`a +${fm(tu)} (${tr} pts) el SL protege +${fm(lu)} (${lk} pts, ≈${fm(SPf().NET_USD)} netos)`}.`:`Cantidad inválida: ${sym} entre 1 y ${MAX[sym]}.`};
 card.querySelector("[data-sym]").onchange=e=>{sym=e.target.value;qty=defQ(sym);setPhase("choose")};qi.oninput=upd;[qi,card.querySelector("[data-sym]")].forEach(x=>x.onclick=e=>e.stopPropagation());upd();
 card.querySelectorAll("[data-s]").forEach(b=>b.onclick=e=>{e.stopPropagation();go(b.dataset.s)})}
else if(p==="blocked"){setAwake(false);card.innerHTML=`<div class=h>Bloqueado</div><div class="msg no">${extra||chk.msg}</div><div class=msg>Pon TradingView en <b>Paper Trading</b> o en una cuenta <b>demo de Tradovate</b>. Las cuentas Lucid (LFE/LFF) solo se operan si están en real-allowlist.json, ya activas en TradingView y confirmadas.</div>`;card.style.display="block";setTimeout(()=>phase==="blocked"&&setPhase("off"),6000)}
else if(p==="running"){setAwake(true);bub.textContent="Operando…";bub.style.display="block"}
else if(p==="summary"){setAwake(false);bub.textContent="Prueba terminada";bub.style.display="block"}
else if(p==="off"){restoreBot();setTimeout(()=>{const b=pill()&&pill().querySelector("b");if(b&&b.textContent==="Durmiendo")b.textContent=S()&&S().botEnabled()?"Activo":"Pausado"},50);live.style.display="none"}}
async function go(side){card.querySelectorAll("button").forEach(b=>b.disabled=true);chk=await J("/api/colchon/check");
 if(!chk.paper&&!chk.real){setPhase("blocked",chk.msg);return}
 if(!accId){setPhase("blocked","Elige una cuenta");return}const sa=accs&&accs.ok&&accs.accounts.find(a=>String(a.id)===String(accId));let cr=false;
 if((sa&&sa.real)||chk.real){if(!confirm(`CUENTA REAL · ${chk.realLabel||(sa&&sa.realLabel)||""}\n${side==="long"?"COMPRA":"VENTA"} ${qty} ${sym} · ${((strs||[]).find(x=>x.id===stratId)||{name:stratId}).name}\n${sa&&!sa.current?"El motor activará esta cuenta en TradingView (solo si no hay trades ni órdenes abiertas).\n":""}Es dinero real. ¿Arrancar la prueba?`)){setPhase("choose");return}cr=true}
 const r=await J("/api/colchon/start",{side,symbol:sym,qty,accountId:accId,strategyId:stratId,confirmReal:cr});if(!r.ok){setPhase("blocked",r.err||"No se pudo iniciar");return}setPhase("running");poll()}
function latHTML(l){if(!l)return'<div class=lat>Latencia: aún no se movió el SL.</div>';return`<div class=lat>Método <b>${l.metodo==="api"?"API":"UI (clics)"}</b>${l.via&&l.via!=="ui"?" · "+l.via:""}<br>Leer <b>${ms(l.leerMs)}</b> · Modificar <b>${ms(l.modificarMs)}</b> · Confirmar <b>${ms(l.confirmarMs)}</b>${l.metodo==="ui"?`<br>Intento API <b>${ms(l.apiIntentoMs)}</b> · UI <b>${ms(l.uiMs)}</b>`:""}<br>Total <b>${ms(l.totalDesdeLecturaMs)}</b> <span style="opacity:.55">(+ hasta ${ms(l.maxRetrasoPorPollMs)} entre lecturas)</span></div>`}
async function poll(){clearTimeout(pollT);if(!on)return;const s=await J("/api/colchon/status");
 if(s.state==="running"){live.style.display="block";live.innerHTML=`<div class=h><span>${(s.strategy&&s.strategy.name)||"Prueba"} · ${s.side==="long"?"COMPRA":"VENTA"} ${s.qty} ${s.symbol}</span><span>${s.mode==="real"?`<b style="background:#d32f2f;color:#fff;padding:1px 6px;border-radius:4px">CUENTA REAL · ${s.realLabel||""}</b>`:(s.mode||"")}</span></div>
<div class=kv><div>Entrada<b>${s.entry??"—"}</b></div><div>P&L<b style="color:${(s.pnl||0)>=0?"#9dff8a":"#ff9bb0"}">${usd(s.pnl)}</b></div><div>SL actual<b>${s.sl??"—"}</b></div>${(()=>{const st=s.steps||[],k=s.step||0;if(s.steps&&!s.steps.length)return `<div>Stop<b>fijo · sin movimientos</b></div>`;const cur=k?st[k-1]:null,nx=st[k];return `<div>Paso ${k}/${st.length||1}${cur?" · protege +"+fm(cur.lockUsd):""}<b style="color:${k?"#ffd86b":"inherit"}">${k?"Movido ✓":"Sin mover"}</b></div><div>Siguiente<b>${nx?"+"+fm(nx.triggerUsd)+" → +"+fm(nx.lockUsd):"— (último)"}</b></div>`})()}</div>${s.fuenteLider?`<div class=msg style="font-size:11px;margin:4px 0">· fuente <b>${s.fuenteLider}</b> (${s.fuenteModo||""})</div>`:""}${s.alerta?`<div class="msg no" style="color:#ff5252;font-weight:800;margin:4px 0">${s.alerta}</div>`:""}${latHTML(s.latency)}
<div class=lg>${(s.log||[]).slice(-5).join("\n")}</div><button class=act data-stop>Detener y cerrar posición</button>`;
  live.querySelector("[data-stop]").onclick=async()=>{if(!confirm(`¿Detener la prueba y cerrar la posición en ${s.mode==="real"?"la CUENTA REAL":"Paper"}?`))return;await J("/api/colchon/stop",{flatten:true});poll()};
  pollT=setTimeout(poll,1000);return}
 if(phase==="running"||s.summary){const sm=await J("/api/colchon/summary");if(sm&&sm.direccion&&sm.fin!==lastSum){lastSum=sm.fin;showSummary(sm)}}}
function showSummary(m){setPhase("summary");const l=m.latencia;live.style.display="block";live.innerHTML=`<div class=h><span>Resumen · ${m.estrategia||"Prueba"}</span><span>${m.modo||""}</span></div>
<div style="font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.42)">P&L final${m.pnlFinalAprox?" (aprox.)":""}</div><div class=big style="color:${(m.pnlFinalUSD||0)>=0?"#ffd86b":"#ff9bb0"}">${usd(m.pnlFinalUSD)}</div>
<div class=kv><div>Dirección<b>${m.direccion}</b></div><div>Tamaño<b>${m.tamano}</b></div><div>Motivo<b>${m.motivo}</b></div>${m.pasosTotal===0?`<div>Stop<b>fijo · sin movimientos</b></div>`:`<div>Colchón ${m.colchonUSD!=null?"+"+fm(m.colchonUSD):""}<b>${m.colchonMovido?"Movido ✓ "+(m.slColchon??""):"No se activó"}</b></div>`}<div>Duración<b>${dur(m.duracionSeg)}</b></div><div>Colchón a los<b>${m.colchonTrasSeg!=null?dur(m.colchonTrasSeg):"—"}</b></div></div>${(m.pasos&&m.pasos.length)?`<div class=lat style="background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)">${m.pasos.map(p=>`Paso <b>${p.paso}/${m.pasosTotal}</b> · protege <b>+${fm(p.protegeUSD)}</b> (SL ${p.precio}) a los <b>${dur(p.enSeg)}</b>${p.saltados?` · saltó ${p.saltados}`:""}`).join("<br>")}</div>`:""}<div class=lat style="background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)">Abierta <b>${m.abiertaET||"—"}</b> · Cerrada <b>${m.cerradaET||"—"}</b><br><span style="opacity:.55">precisión ±${ms(Math.abs(parseFloat(String(m.precisionMs||"").replace("±",""))||0))}</span></div>${latHTML(l)}${beHTML(m.probabilidadNecesaria&&m.probabilidadNecesaria.pct)}
<button class="act gold" data-ok>Listo</button>`;live.querySelector("[data-ok]").onclick=()=>{live.style.display="none";setPhase("off")}}
// El pill "Agente" abre/cierra siempre el panel colchón. El clic en el agente solo abre el selector de color.
const pill=()=>document.getElementById("botToggle");
addEventListener("click",e=>{const pl=pill();if(!pl||!pl.contains(e.target))return;e.stopImmediatePropagation();e.preventDefault();
 if(phase==="running"){poll();return}
 if(phase==="sleep"||phase==="off"||phase==="summary"){accs=null;setPhase("choose");loadAccs();J("/api/colchon/check").then(c=>{chk=c;if(phase==="choose"){const s=card.querySelector(".h small");s&&(s.textContent=c.paper?"Paper OK":"Bloqueado")}})}else if(phase==="choose")setPhase("off")},true);
function pillLabel(){const b=pill()&&pill().querySelector("b");if(!b)return;const want=on&&phase==="sleep"?"Durmiendo":null;if(want&&b.textContent!==want)b.textContent=want}
new MutationObserver(pillLabel).observe(document.body,{subtree:true,childList:true,characterData:true});
addEventListener("pointerdown",e=>{if(phase==="choose"&&!card.contains(e.target)&&!(pill()&&pill().contains(e.target)))setPhase("off")});
// Sin botón «Prueba»: el panel está siempre disponible desde el pill del agente.
(async()=>{const s=await J("/api/colchon/status");if(s&&s.state==="running"){setPhase("running");poll()}})();
window.__prueba=()=>({on,phase,chk,agent:agentXY()});})();</script>
